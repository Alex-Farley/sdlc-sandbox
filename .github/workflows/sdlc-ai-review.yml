# Light-touch, BLOCKING AI code review. Opt-in, costs a few pence per pull request.
# Turn it on: repo variable AI_REVIEW_ENABLED=true and secret ANTHROPIC_API_KEY (or, for a reviewer
# from a different company to the one writing the code, SDLC_REVIEW_PROVIDER=openai,
# SDLC_REVIEW_MODEL=<model> and secret OPENAI_API_KEY). Then make it required:
# scripts/github-protect.sh --apply --require-ai-review
#
# To keep cost down it waits until guardrails would pass (so after you approve the work item's
# review), sends only the code diff in one request, remembers its verdict for that exact code, and
# refuses very large diffs. See .sdlc/hooks/ai-review.py.
#
# Runs on pull_request_target, so this file and the review script come from the BASE branch. The
# PR's code is checked out only as data and never run. The reviewer has no tools: it can only
# pass/fail and comment. A person can overrule a wrong blocker with the label ai-review-override.
# Dependabot and spike PRs are skipped (a skipped job counts as passed for a required check).
name: sdlc-ai-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: sdlc-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ai-review:
    if: >-
      vars.AI_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'spike/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR as data (never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load trusted scripts and config from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          T="$RUNNER_TEMP/trusted"; mkdir -p "$T"
          git archive "$BASE_SHA" .sdlc/hooks .sdlc/config scripts/sdlc | tar -x -C "$T"
          git show "$BASE_SHA:.sdlc/allowed_signers" > "$T/allowed_signers" 2>/dev/null || : > "$T/allowed_signers"
      - name: Review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SDLC_REVIEW_PROVIDER: ${{ vars.SDLC_REVIEW_PROVIDER }}
          SDLC_REVIEW_MODEL: ${{ vars.SDLC_REVIEW_MODEL }}
          SDLC_REVIEW_MAX_KB: ${{ vars.SDLC_REVIEW_MAX_KB }}
        run: |
          T="$RUNNER_TEMP/trusted"
          export SDLC_LIB="$T/.sdlc/hooks/lib.sh" SDLC_CONFIG_FILE="$T/.sdlc/config" SDLC_SIGNERS_FILE="$T/allowed_signers"
          export SDLC_TRUSTED_SDLC="$T/scripts/sdlc" SDLC_HEAD_REF="$HEAD_REF" CI=true
          python3 "$T/.sdlc/hooks/ai-review.py"
